name: GitHub generic MCP adapter
on:
  pull_request:
    paths:
      - 'connections/github/**'
      - '.github/workflows/github-generic-mcp.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        if: runner.os == 'Linux'
      - run: npm run build
        if: runner.os == 'Windows'
      - name: Windows GitHub adapter regression
        if: runner.os == 'Windows'
        run: node --test --test-concurrency=2 --test-timeout=30000 connections/github/tests/*.test.mjs
      - run: npm run check:boundaries
        if: runner.os == 'Windows'
