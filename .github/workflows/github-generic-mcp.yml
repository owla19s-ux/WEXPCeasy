name: GitHub generic MCP verification
on:
  push:
    branches: [codex/github-mcp-130431d-20261108]
  pull_request:
    paths:
      - 'connections/github/**'
      - '.github/workflows/github-generic-mcp.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:github
      - run: npm test
      - run: npm run check:boundaries
