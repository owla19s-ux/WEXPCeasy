name: GitHub generic MCP verification
on:
  push:
    branches: [main, codex/github-mcp-130431d-20261108]
    paths:
      - 'connections/github/**'
      - 'connections/src/**'
      - 'connections/tests/**'
      - '.github/workflows/github-generic-mcp.yml'
  pull_request:
    paths:
      - 'connections/github/**'
      - 'connections/src/**'
      - 'connections/tests/**'
      - '.github/workflows/github-generic-mcp.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Public Connections and GitHub adapter suites
        run: npm run build && node --test connections/tests/*.test.mjs connections/github/tests/*.test.mjs
      - name: Full suite on Linux
        if: runner.os == 'Linux'
        run: npm test
      - name: Full suite with bounded Windows concurrency
        if: runner.os == 'Windows'
        run: node --test --test-concurrency=2 --test-timeout=30000 shared/tests/*.test.mjs permissions/tests/*.test.mjs app/tests/*.test.mjs connections/tests/*.test.mjs connections/github/tests/*.test.mjs connections/local/tests/*.test.mjs connections/api/tests/*.test.mjs tools/tests/*.test.mjs UI/tests/*.test.mjs space/tests/*.test.mjs AI/tests/*.test.mjs conversations/tests/*.test.mjs
      - run: npm run check:boundaries
  official-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - run: npm run build
      - name: Build pinned official source and exercise generic tools
        run: node connections/github/tests/live-generic-mcp.mjs
        env:
          WEX_GITHUB_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-generic-mcp-${{ runner.os }}-${{ github.sha }}
          path: github-generic-mcp-evidence.json
          if-no-files-found: warn
