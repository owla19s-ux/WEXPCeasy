name: GitHub official components acceptance
on:
  push:
    branches: [main]
    paths:
      - 'connections/github/**'
      - 'connections/src/**'
      - 'app/src/foundations.ts'
      - 'app/tests/github-official-host.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/github-official-components.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Vault-backed host assembly and restart contracts
        run: node --test app/tests/github-official-host.test.mjs
      - name: Official SDK and pinned native MCP read
        run: node connections/github/tests/live-official-components.mjs
        env:
          WEX_GITHUB_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-official-components-${{ runner.os }}-${{ github.sha }}
          path: github-official-components-evidence.json
          if-no-files-found: warn
