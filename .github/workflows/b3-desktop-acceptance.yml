name: B3 desktop host acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: node --test app/tests/desktop-host.test.mjs app/tests/desktop-space.test.mjs app/tests/desktop-credentials.test.mjs shared/tests/credentials.test.mjs tools/tests/boundaries.test.mjs
      - name: Actual sandboxed Electron on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/verify-desktop.mjs
      - name: Actual Electron on Windows
        if: runner.os == 'Windows'
        run: node tools/verify-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b3-desktop-${{ runner.os }}-${{ github.sha }}
          path: desktop-acceptance/
          if-no-files-found: warn
