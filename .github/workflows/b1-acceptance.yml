name: B1 public contract acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Record evidence scope
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('b1-evidence.json',JSON.stringify({sha:process.env.GITHUB_SHA,runtime:process.version,platform:process.platform,scope:'B1 owner suites and public contracts: process exit, SQLite recovery and fresh authorization',overallAcceptance:'not_asserted_by_workflow',limitations:['Trusted identity and Provider observations are fixtures','No authenticated GitHub service call','No paid Provider call','No manual Windows acceptance or installer validation','No B2 complete chain validation']},null,2));"
      - name: Verify Windows native Local access before the combined owner suites
        if: runner.os == 'Windows'
        run: node --test --test-concurrency=1 --test-timeout=30000 connections/local/tests/*.test.mjs
      - name: Independently verify backend owners and public contracts
        run: >-
          node --test --test-concurrency=2 --test-timeout=30000 --test-reporter=junit --test-reporter-destination=b1-acceptance.xml
          shared/tests/*.test.mjs permissions/tests/*.test.mjs space/tests/*.test.mjs
          connections/api/tests/*.test.mjs AI/tests/*.test.mjs conversations/tests/*.test.mjs
          connections/tests/*.test.mjs connections/github/tests/*.test.mjs connections/local/tests/*.test.mjs
          app/tests/b1-acceptance.test.mjs
      - run: npm run check:boundaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-public-contracts-${{ matrix.os }}-${{ github.sha }}
          path: |
            b1-evidence.json
            b1-acceptance.xml
          if-no-files-found: error
